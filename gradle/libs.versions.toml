[bundles]
compose-ui = ["androidx-ui", "androidx-ui-graphics", "androidx-ui-tooling-preview", "androidx-material3"]
compose-test = ["androidx-ui-test-junit4", "androidx-ui-test-manifest"]
room = ["androidx-room-runtime", "androidx-room-ktx"]
android-test-support = ["androidx-test-core", "androidx-test-runner"]
instrumented-e2e = [
    "androidx-work-testing",
    "androidx-room-testing",
    "okhttp-mockwebserver",
    "androidx-test-core",
    "androidx-test-runner",
    "androidx-test-rules",
    "kotlinx-coroutines-test",
]

[plugins]
